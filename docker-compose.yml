# 一键部署：docker compose up -d --build
# 访问: http://localhost:8080（前端+Nginx），API 经 Nginx 反代，Qdrant 为内部服务
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: fitpilot-qdrant
    ports:
      - "6333:6333" # 暴露给宿主机：开发模式下本机脚本直连用
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    container_name: fitpilot-api
    environment:
      # compose 网络内用服务名访问 Qdrant（覆盖 .env/默认值里的 localhost）
      QDRANT_URL: http://qdrant:6333
    env_file:
      - .env # ZHIPU_API_KEY / LANGFUSE_* 等
    volumes:
      # SQLite 库 + BM25 缓存 + 语料落在宿主机，容器重建不丢数据
      - ./data:/app/data
    depends_on:
      - qdrant
    restart: unless-stopped

  web:
    build: ./web
    container_name: fitpilot-web
    ports:
      - "8090:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  qdrant_data:
